[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-probe"
version = "0.1.0"
description = "Quantization sensitivity analysis for safetensors diffusion models"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "safetensors",
]

[project.scripts]
quant-probe = "quant_probe.cli:main"

# The repository root *is* the quant_probe package: there is no quant_probe/
# subdirectory. `[tool.setuptools.packages.find]` cannot express that — it only
# scans subdirectories, so it matched nothing, produced an empty wheel and the
# console script failed with `ModuleNotFoundError: No module named 'quant_probe'`.
# The mapping below is the explicit equivalent.
[tool.setuptools]
packages = ["quant_probe", "quant_probe.models"]
package-dir = { "quant_probe" = "." }
